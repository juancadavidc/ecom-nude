name: Staging

# Merge a main → mismos checks y smoke que ci.yml → imagen
# ghcr.io/juancadavidc/ecom-nude/tienda con tags `staging` y `<sha>` → redeploy de la app de
# staging en Coolify. `latest` es solo de produccion: lo mueve release.yml.
# Ver juancadavidc/shared-gha-stackless.

on:
  push:
    branches: [main]

# Un merge nuevo reemplaza al anterior: solo se publica y despliega el ultimo.
concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging:
    permissions:
      contents: read
      packages: write
    uses: juancadavidc/shared-gha-stackless/.github/workflows/staging.yml@v1
    with:
      working-directory: tienda
      node-version-file: tienda/.nvmrc
      skip-scripts: build
      context: tienda
      dockerfile: tienda/docker/Dockerfile
      service: tienda
      smoke-health-paths: /api/health /api/health/db
      smoke-env: |
        BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-0000
        BETTER_AUTH_URL=http://localhost:3000
        GOOGLE_CLIENT_ID=ci
        GOOGLE_CLIENT_SECRET=ci
      staging-url: ${{ vars.STAGING_URL }}
    secrets: inherit
